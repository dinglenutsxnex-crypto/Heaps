name: Build and Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Install haxelib deps
        run: |
          haxelib install heaps --quiet
          haxelib install hlsdl --quiet

      - name: Build web target
        run: haxe build-web.hxml

      - name: Assemble site
        run: |
          mkdir -p site
          cp web/index.html site/index.html
          cp bin/web/game.js site/game.js
          cp -r src/assets site/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
